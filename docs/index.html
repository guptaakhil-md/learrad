<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Worklist – Reporting Simulator</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js"></script>
</head>
<body>
  <header>
    <span class="brand">Reporting Simulator</span>
    <nav>
      <a href="index.html">Worklist</a>
    </nav>
  </header>

  <main>
    <h1>Worklist</h1>

    <table>
      <thead>
        <tr>
          <th>Accession</th>
          <th>Age / Sex</th>
          <th>Modality</th>
          <th>Study</th>
          <th>Clinical history</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="worklist">
        <tr><td colspan="6">Loading…</td></tr>
      </tbody>
    </table>
  </main>

  <script>
    function cell(text) {
      var td = document.createElement('td');
      td.textContent = text;
      return td;
    }

    loadCases().then(function (cases) {
      var body = document.getElementById('worklist');
      body.textContent = '';
      cases.forEach(function (c) {
        var row = document.createElement('tr');
        var first = document.createElement('td');
        var link = document.createElement('a');
        link.href = 'read.html?case=' + encodeURIComponent(c.id);
        link.textContent = c.id.toUpperCase();
        first.appendChild(link);
        row.appendChild(first);
        row.appendChild(cell(c.age + ' / ' + c.sex));
        row.appendChild(cell(c.modality));
        row.appendChild(cell(c.study));
        row.appendChild(cell(c.history));
        row.appendChild(cell('Unread'));
        body.appendChild(row);
      });
    }).catch(function (error) {
      document.getElementById('worklist').innerHTML = '';
      var row = document.createElement('tr');
      var td = cell(error.message);
      td.colSpan = 6;
      row.appendChild(td);
      document.getElementById('worklist').appendChild(row);
    });
  </script>
</body>
</html>
